
interface=wlan0
driver=nl80211

bssid=02:00:00:00:00:00

ssid=testnetwork

# Hardware mode (g = 2.4GHz)
hw_mode=g

channel=1

# --- WPA3-Personal (SAE) Configuration ---

wpa=2

wpa_key_mgmt=SAE

rsn_pairwise=CCMP

sae_password=passphrase

# 0=disabled, 1=optional, 2=required. WPA3 demands this.
ieee80211w=2

sae_require_mfp=1